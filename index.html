<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pip._.nails — handmade press-on sets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Karla:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <span class="wordmark">pip<span class="dot">.</span>_<span class="dot">.</span>nails</span>
    <nav class="topnav">
      <a href="catalogue.html">Catalogue</a>
      <a href="https://instagram.com/pip._.nails" target="_blank" rel="noopener">Enquire</a>
    </nav>
  </div>
</header>

<main>
  <section class="hero" aria-label="Featured nail sets">

    <div class="hero-glow" aria-hidden="true"></div>

    <h1 class="setname" aria-live="polite">
      <span class="setname-text" data-setname>Tidepool</span>
    </h1>

    <div class="stage" data-stage>
      <ul class="track" data-track>
        <li class="slide" data-slide>
          <img src="images/tidepool.png" alt="Tidepool press-on set: black and slate nails with pearl chrome, shell ridges and a starfish charm.">
        </li>
        <li class="slide" data-slide>
          <img src="images/spectre.png" alt="Spectre press-on set: bone-cream nails with hand-inked spirals, a bow, a silver star and a small ghost charm.">
        </li>
        <li class="slide" data-slide>
          <img src="images/selene.png" alt="Selene press-on set: lilac chrome nails with moons, suns, starbursts and domed silver studs.">
        </li>
      </ul>

      <button class="arrow arrow-prev" data-prev aria-label="Previous set">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4 7 12l8 8"/></svg>
      </button>
      <button class="arrow arrow-next" data-next aria-label="Next set">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4l8 8-8 8"/></svg>
      </button>
    </div>

    <div class="caption">
      <p class="blurb" data-blurb>Pearl chrome over rockpool black, with a hand-sculpted starfish.</p>
      <p class="spec" data-spec>10 nails · almond · medium</p>
      <a class="cta" href="catalogue.html">See all sets</a>
      <a class="cta-quiet" href="https://ig.me/m/pip._.nails" target="_blank" rel="noopener">Message pip</a>
    </div>

    <div class="dots" role="tablist" aria-label="Choose a set" data-dots></div>

  </section>
</main>

<script src="carousel.js"></script>
</body>
</html>
